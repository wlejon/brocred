name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# brocred has no sibling dependencies; it links the OS (sd-bus and PAM on
# Linux). The repo is still checked out into a named path (brocred/), the
# layout every sibling's CI uses.
#
# Hosted runners are disposable machines, so the tests that a desktop user has
# to opt into run here:
#
#   BROCRED_TEST_AUTH=1           wrong-password attempts against the runner's
#                                 own account in test_*_verifier (they count
#                                 toward lockout policies on a real machine).
#   BROCRED_TEST_TEMP_KEYCHAIN=1  macOS: the keychain tests run against an
#                                 unlocked temporary keychain, made the default
#                                 for the test's duration; a CI session's login
#                                 keychain is locked.
#
# On Linux the tests run inside a D-Bus session with gnome-keyring unlocked in
# it, so the Secret Service backend and the secret-tool oracle are real rather
# than skipped. Nothing here can enrol a fingerprint, so the biometric tests
# check the honest "no sensor" answers.
env:
  BROCRED_TEST_AUTH: "1"
  BROCRED_TEST_TEMP_KEYCHAIN: "1"
  LINUX_PACKAGES: >-
    ninja-build pkg-config libsystemd-dev libpam0g-dev libssl-dev
    dbus-daemon dbus-bin libsecret-tools gnome-keyring

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,          os: ubuntu-24.04, cc: gcc,   cxx: g++,     config: Release }
          - { name: linux-clang,        os: ubuntu-24.04, cc: clang, cxx: clang++, config: Release }
          - { name: windows-msvc,       os: windows-2022,                          config: Release }
          # Debug CRT: iterator debugging and the library's own assert()s.
          - { name: windows-msvc-debug, os: windows-2022,                          config: Debug }
          - { name: macos-arm64,        os: macos-15,                              config: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brocred

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # ON rather than AUTO on Linux: a package missing from the list above
      # must fail the configure, not quietly build the fallback.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S brocred -B build
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S brocred -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
              -DBROCRED_WITH_SDBUS=ON -DBROCRED_WITH_PAM=ON
          else
            cmake -S brocred -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Test (D-Bus session + unlocked gnome-keyring)
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash brocred/.github/scripts/with-keyring.sh ctest --test-dir build --output-on-failure

      # ctest shows a skipped test's output nowhere, so its reason goes to the
      # job summary: a skip is only honest if someone can read why.
      - name: Skip reasons
        if: always()
        shell: bash
        run: |
          { echo "### Skipped tests (${{ matrix.name }})"; echo '```'
            grep -h 'SKIPPED:' build/Testing/Temporary/LastTest*.log || echo none
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Integration-free tier ─────────────────────────────────────────────────
  #
  # Both Linux integrations are optional. Without sd-bus the store is the file
  # keystore and fprintd cannot be asked; without PAM verify_password() fails
  # with an explanation. That build is what a minimal distribution gets, and
  # test_linux_features checks compiled_features() says exactly that.
  no-integrations:
    name: No sd-bus, no PAM · ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brocred

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: |
          cmake -S brocred -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBROCRED_WITH_SDBUS=OFF -DBROCRED_WITH_PAM=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Skip reasons
        if: always()
        run: |
          { echo '### Skipped tests (no sd-bus, no PAM)'; echo '```'
            grep -h 'SKIPPED:' build/Testing/Temporary/LastTest*.log || echo none
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Debug (-O0), so this is also the Linux job where assert()s are live.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brocred

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcovr $LINUX_PACKAGES

      - name: Configure (instrumented)
        run: |
          cmake -S brocred -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBROCRED_COVERAGE=ON \
            -DBROCRED_WITH_SDBUS=ON -DBROCRED_WITH_PAM=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: dbus-run-session -- bash brocred/.github/scripts/with-keyring.sh ctest --test-dir build --output-on-failure

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      #
      # Run from the workspace root, where build/ is, with the filters spelled
      # brocred/...: gcovr only looks for .gcda files under its root.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'brocred/src/' --filter 'brocred/include/brocred/' \
            --exclude-unreachable-branches \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `src/` + `include/brocred/`'
            echo
            echo 'Linux backends only (Secret Service, file keystore, PAM, fprintd); the Windows and macOS backends are exercised by the test matrix, not measured.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
